name: Source QA

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Syntax, stable API types, regression tests, and packaged add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Verify JavaScript syntax
        run: |
          for file in BP/scripts/*.js tests/*.js tools/*.mjs; do
            node --check "$file"
          done
      - name: Verify stable Script API declarations
        run: npx tsc --noEmit
      - name: Run regression tests
        run: node --test tests/*.test.js
      - name: Validate manifests, items, recipes, compass frames and material selection
        run: node tools/verify.mjs --source
      - name: Build and verify add-on without private terrain input
        run: |
          node tools/build.mjs --addon-only
          node tools/verify.mjs --addon-only
      - name: Build full world from preserved v1.6.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/manhunt-base
          gh release download v1.6.0 -R "$GITHUB_REPOSITORY" -p 'Manhunt_Night_v1.6.0.mcworld' --dir /tmp/manhunt-base
          node tools/build.mjs --base /tmp/manhunt-base/Manhunt_Night_v1.6.0.mcworld
          node tools/verify.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Manhunt-Night-v1.7.0-portable-world-preview
          path: dist/
          if-no-files-found: error
